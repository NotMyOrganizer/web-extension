<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Browser Inspector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>Browser Inspector</h1>

    <div class="controls">

  </div>

  <script src="popup.js"></script>
</body>
</html>
